name: Bug report
description: Something in the pipeline does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: `bash scripts/bootstrap.sh` catches most environment
        problems (not enough memory for Docker, a port already in use, a missing
        `.env` key) and its output is usually the answer.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
      placeholder: |
        `make verify-no-duplicates` exits 1 after a clean `make up`, reporting
        four duplicate event_ids. I expected zero.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact commands, in order, starting from a clean clone if you can.
      value: |
        1. `cp .env.example .env`
        2. `make up`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >
        Output of the failing command, plus `make ps`. If a container is
        unhealthy, `make logs SERVICE=<name>` for that one service. Please paste
        text rather than a screenshot so it is searchable.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: profile
    attributes:
      label: Which profile
      options:
        - full (make up)
        - core (make up-core)
        - neither — this is a unit test or lint failure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Output of `docker version --format '{{.Server.Version}}'`,
        `docker info --format '{{.NCPU}} cpus {{.MemTotal}} bytes'`,
        `uname -srm` and `python3 --version`.
      render: shell
    validations:
      required: true
