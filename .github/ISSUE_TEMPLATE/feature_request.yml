name: Feature request
description: Propose a change to the pipeline, the marts, the tests or the docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The project's scope is deliberately narrow — see the "Scope" section of
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). Proposals for an ML
        layer, a frontend framework or a second cloud implementation are
        declined on purpose, and the README says why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: >
        Describe the gap, not the solution. "There is no way to tell how far
        behind the silver stream is without reading Kafka by hand" is a problem;
        "add Prometheus" is a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would build, and roughly where it would live in the tree.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        What else would solve the same problem, and why this is better. A
        proposal with no rejected alternative is usually under-thought.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Producer / source
        - Spark streaming (bronze or silver)
        - Iceberg tables and maintenance
        - dbt models and tests
        - Dagster assets and checks
        - Docs
        - CI / tooling
        - Infra (Terraform / Kubernetes, plan-only)
    validations:
      required: true

  - type: checkboxes
    id: correctness
    attributes:
      label: Guarantees
      options:
        - label: >
            This change would alter a guarantee documented in
            docs/correctness.md, and I have said which one above.
          required: false
