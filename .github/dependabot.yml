version: 2

# Grouped and weekly rather than per-dependency and daily: this project pins
# exactly, so an ungrouped Dependabot would open a dozen pull requests that each
# need the full integration suite to run. One batched pull request a week is
# reviewable; twelve is noise that gets ignored, which is worse than none.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "sqlfluff", "pre-commit"]
      data-stack:
        patterns: ["pyspark", "confluent-kafka", "dbt-*", "dagster*", "duckdb", "trino"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    # Spark, Iceberg and Trino only work in tested combinations; a major bump is
    # a compatibility-matrix exercise, not a version bump, so it gets raised
    # deliberately rather than by a bot.
    ignore:
      - dependency-name: "apache/spark"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache/iceberg-rest-fixture"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
