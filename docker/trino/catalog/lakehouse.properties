# The Iceberg catalog, named `lakehouse` so that a table identifier is spelled the
# same way in Trino as in Spark: `lakehouse.silver.edits`. Trino's convention would
# be to call this catalog `iceberg`, which is the connector rather than the data,
# and would leave every query in the README needing a translation step.
#
# The whole point of this file is that Trino is told nothing about how the tables
# were written. It asks the same REST catalog Spark commits to, reads the same
# metadata files out of the same bucket, and gets the current snapshot. No sync
# job, no second copy, no export. That is the claim the `make query` output backs.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181

# The REST fixture keys its catalog on the warehouse location, so a client that
# omits this gets a 400 from `GET /v1/config` rather than a useful error.
iceberg.rest-catalog.warehouse=s3://lakehouse/warehouse

# Trino's own S3 client, not the Hadoop one. Same reasoning as S3FileIO on the
# Spark side: one fewer filesystem layer, and it is the path Trino tests.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
# MinIO serves bucket-in-path. Without this the client resolves `lakehouse.minio`
# and the failure reads like DNS, not like configuration.
s3.path-style-access=true
# Read from the environment rather than written here. These are the same MinIO
# defaults the rest of the stack uses and they open one empty local bucket, but a
# credential written into a file is a habit worth not having — and it means this
# file is correct even when someone changes them in `.env`.
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

# What dbt writes. Parquet with zstd matches what the Spark jobs produce, so a
# gold table and a silver table are comparable when reading file statistics.
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Trino caches table metadata per query by default, which is what you want. This
# is the cross-query cache, and 30s of staleness is invisible next to a 30-second
# micro-batch trigger while removing a metadata round trip from every query.
iceberg.metadata-cache.enabled=true
