# One ServiceAccount for both pods, with no Role and no RoleBinding, and that is
# the point of it: neither process has any Kubernetes permission at all.
#
# It is worth saying why, because a Dagster deployment on Kubernetes usually does
# need RBAC. The common setup uses `K8sRunLauncher`, which creates a Job per run
# and therefore needs create/get/list/watch on jobs and pods. This deployment
# keeps the default run launcher — runs execute as subprocesses inside these two
# pods, exactly as they do under Compose — so there is nothing to grant. See
# k8s/README.md for why that choice was left alone rather than upgraded.
#
# `automountServiceAccountToken: false` is the consequence made concrete. A token
# mounted into a pod that never calls the API server is credential material sitting
# on a filesystem for no reason, and it is the first thing worth reading from a
# container someone has just got a shell in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster
automountServiceAccountToken: false
